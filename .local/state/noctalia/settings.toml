config_version = 14

[backdrop]
enabled = true

[bar.default]
background_opacity = 0.50999998860061169
center = [ "clock", "status" ]
contact_shadow = true
start = [ "launcher", "wallpaper", "workspaces", "cat", "bar" ]

[location]
auto_locate = true

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-1", "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 1280.0
    cy = 1197.3333740234375
    output = "HDMI-A-1"
    placement_height = 1440.0
    placement_width = 2560.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[nightlight]
enabled = true

[plugins]
enabled = [
    "carlocamacho/taildrop",
    "rylos/tailnet",
    "davemhammer/tailscale",
    "nilsonlinux/speedtest-meter",
    "dotnetrob/cat",
    "noctalia/kaomoji"
]

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

[shell.panel]
floating_layer = "top"
transparency_mode = "glass"

[theme]
builtin = "Ayu"
community_palette = "Oxocarbon"
custom_palette = "wp4094320-rb"
mode = "dark"
source = "custom"
wallpaper_scheme = "m3-rainbow"

    [theme.templates]
    builtin_ids = [ "kitty", "niri" ]

[wallpaper.default]
path = "/home/rosie/Pictures/wp4094320.png"

[wallpaper.last]
path = "/home/rosie/Pictures/wp4094320.png"

[wallpaper.monitors.eDP-1]
path = "/home/rosie/Pictures/wp4094320.png"

[widget.bar]
type = "rylos/tailnet:bar"

[widget.cat]
type = "dotnetrob/cat:cat"

[widget.clock]
format = "{:%H:%M:%S}"

[widget.status]
type = "davemhammer/tailscale:status"